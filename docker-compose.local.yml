# Standalone local deployment: docker compose -f docker-compose.local.yml up -d --build
name: codex-gateway-local

services:
  codex-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-gateway:local
    container_name: codex-gateway
    restart: unless-stopped
    network_mode: host
    mem_limit: 1g
    memswap_limit: 1g
    env_file:
      - ${CODEX_GATEWAY_RUNTIME_ENV:-./configs/codex-gateway/runtime.env}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: 28141
      NUXT_PUBLIC_I18N_DEFAULT_LOCALE: en
      CODEX_GATEWAY_DB_PATH: /data/codex-gateway.db
      TZ: Europe/Paris
    volumes:
      - type: bind
        source: ${CODEX_GATEWAY_DATA_DIR:-/mnt/data/codex-gateway}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(28141,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
